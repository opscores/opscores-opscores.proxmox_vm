# vars/main.yml
# Пользовательские переопределения переменных для клонируемых ВМ

# Параметры ВМ по умолчанию
# clone_vm_memory: 4096  # Память в MB
# clone_vm_cores: 2      # Количество ядер
# clone_vm_disk_size: "10G"  # Размер диска

# Параметры конфигурации
# clone_vm_ostype: "l26"
# clone_vm_machine: "q35"
# clone_vm_bios: "seabios"
# clone_vm_cpu: "host"
# clone_vm_scsihw: "virtio-scsi-pci"
# clone_vm_agent: "enabled=1"
# clone_vm_disk_slot: "scsi0"

# Параметры пересоздания
# recreate_vm: true  # Пересоздавать ВМ, если она уже существует

# Параметры сети
# use_dhcp_ip: false  # Использовать DHCP вместо статического IP (по умолчанию true)
# static_ip_address: "192.168.1.100"  # Статический IP-адрес
# static_subnet_mask: "24"  # Маска подсети
# static_gateway: "192.168.1.1"  # Статический шлюз


