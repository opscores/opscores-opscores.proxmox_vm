# vars/main.yml
# User overrides for cloned VMs

# Default VM parameters
# clone_vm_memory: 4096  # Memory in MB
# clone_vm_cores: 2      # Number of CPU cores
# clone_vm_disk_size: "10G"  # Disk size

# Configuration parameters
# clone_vm_ostype: "l26"
# clone_vm_machine: "q35"
# clone_vm_bios: "seabios"
# clone_vm_cpu: "host"
# clone_vm_scsihw: "virtio-scsi-pci"
# clone_vm_agent: "enabled=1"
# clone_vm_disk_slot: "scsi0"

# Recreate parameters
# recreate_vm: true  # Recreate VM if it already exists

# Network parameters
# use_dhcp_ip: false  # Use DHCP instead of static IP (default true)
# static_ip_address: "192.168.1.100"  # Static IP address
# static_subnet_mask: "24"  # Subnet mask
# static_gateway: "192.168.1.1"  # Static gateway
