---
# tasks file for clone_vm role

# ============================================================
# Preflight checks
# ============================================================

# 0. Detect Proxmox VE major version (non-blocking, informational)
- name: "Preflight — detect Proxmox VE major version"
  ansible.builtin.shell:
    cmd: "set -o pipefail; pveversion | grep -oP 'pve-manager/\\K[0-9]+' || echo unknown"
  register: cv_pve_version
  changed_when: false

- name: "Preflight — warn if Proxmox VE major version is not the tested target (9.x)"
  ansible.builtin.debug:
    msg: >
      WARNING: detected Proxmox VE major version '{{ cv_pve_version.stdout }}'.
      This collection is developed and tested against Proxmox VE 9.x. It only uses
      generic `qm`/`pvesm` CLI commands with no version-specific flags, so other
      versions may work, but have not been verified. Proceeding anyway.
  when: cv_pve_version.stdout != "9"

# 1. Verify target storage exists and is active
- name: "Preflight — verify target storage exists and active ({{ storage_pool }})"
  ansible.builtin.shell:
    cmd: "set -o pipefail; pvesm status | awk -v pool='{{ storage_pool }}' '$1 == pool && $2 == \"active\" {print $0}'"
  register: cv_storage_active
  failed_when: cv_storage_active.stdout == ""
  changed_when: false

# 2. Check free space in storage_pool
- name: "Preflight — check free space in {{ storage_pool }}"
  ansible.builtin.shell:
    cmd: "set -o pipefail; pvesm status | awk -v pool='{{ storage_pool }}' '$1 == pool {print $6}'"
  register: cv_storage_free
  failed_when: (cv_storage_free.stdout | int / 1073741824) | int < storage_min_free_gb
  changed_when: false

# 3. Check if VM config exists for {{ new_vm_id }}
- name: "Check if VM config file exists for ID {{ new_vm_id }}"
  ansible.builtin.command:
    cmd: "test -f /etc/pve/nodes/{{ target_node }}/qemu-server/{{ new_vm_id }}.conf"
  register: cv_vm_config_exists
  changed_when: false
  failed_when: false

# 4. Verify local storage has snippets content type (precise check)
- name: "Verify local storage supports snippets"
  ansible.builtin.shell:
    cmd: |
      awk '
        /^local:/ { in_local=1 }
        /^[^ ]/ && !/^local:/ { in_local=0 }
        in_local && /content.*snippets/ { found=1 }
        END { exit (found ? 0 : 1) }
      ' /etc/pve/storage.cfg
  register: cv_snippets_check
  changed_when: false
  failed_when: cv_snippets_check.rc != 0

# 5. Validate required variables for clone_vm
- name: "Validate required variables are defined"
  ansible.builtin.assert:
    that:
      - source_vm_id is defined
      - new_vm_id is defined
      - new_vm_name is defined
      - os_type is defined
      - target_node is defined
      - storage_pool is defined
      - full_clone is defined
      - cloud_user is defined
      - cloud_password is defined
      - ssh_public_key is defined
    fail_msg: >
      Missing required variable(s). Required: source_vm_id, new_vm_id, new_vm_name,
      os_type, target_node, storage_pool, full_clone, cloud_user, cloud_password, ssh_public_key
      Current values: source_vm_id={{ source_vm_id | default('UNDEFINED') }},
      new_vm_id={{ new_vm_id | default('UNDEFINED') }}, new_vm_name={{ new_vm_name | default('UNDEFINED') }},
      os_type={{ os_type | default('UNDEFINED') }}, target_node={{ target_node | default('UNDEFINED') }},
      storage_pool={{ storage_pool | default('UNDEFINED') }}, full_clone={{ full_clone | default('UNDEFINED') }},
      cloud_user={{ cloud_user | default('***redacted***') }}, cloud_password=***redacted***,
      ssh_public_key={{ ssh_public_key | default('***redacted***') }}

# ============================================================
# Validate VM ID range
# ============================================================

- name: "Validate VM ID is in valid Proxmox range"
  ansible.builtin.assert:
    that:
      - new_vm_id | int >= 100
      - new_vm_id | int <= 999999999
    fail_msg: >
      Invalid VM ID {{ new_vm_id }}. Must be between 100 and 999999999.

- name: "Validate hostname is RFC 1123 compliant"
  ansible.builtin.assert:
    that:
      - new_vm_name is match('^[a-zA-Z0-9]([a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9])?)*$')
    fail_msg: >
      Invalid hostname '{{ new_vm_name }}'. RFC 1123 requires: alphanumeric characters,
      hyphens, and dots only. Each label must start and end with alphanumeric (max 63 chars).
      Underscores and other special characters are not allowed.

# ============================================================
# Remove existing VM (recreate)
# ============================================================

# 4. Stop existing VM (if running and recreate=true)
- name: "Stop existing VM if it exists and is running and recreate is true (ID {{ new_vm_id }})"
  ansible.builtin.command:
    cmd: "qm stop {{ new_vm_id }}"
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool
  failed_when: false
  register: cv_stop_result
  changed_when: true
  until: cv_stop_result.rc == 0
  retries: 3
  delay: 10

- name: "Destroy existing VM if it exists and recreate is true (ID {{ new_vm_id }})"
  ansible.builtin.command:
    cmd: "qm destroy {{ new_vm_id }} --purge"
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool
  register: cv_destroy_result
  changed_when: true

# 6. Report deletion
- name: "Report that existing VM was destroyed"
  ansible.builtin.debug:
    msg: "Removed existing VM with ID {{ new_vm_id }} to proceed with creation."
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool and cv_destroy_result is defined and cv_destroy_result.changed

- name: "Clean up orphaned cloud-init snippet for recreated VM"
  ansible.builtin.file:
    path: "{{ snippets_path }}/ci-{{ new_vm_id }}.yaml"
    state: absent
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool

# ============================================================
# Validation and cloning
# ============================================================

# 7. Verify source template {{ source_vm_id }} exists
- name: "Check if source template exists and is a template"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ source_vm_id }} | grep -qx 'template: 1'"
  register: cv_template_check
  changed_when: false
  failed_when: cv_template_check.rc != 0
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool

# 8. Clone VM from template {{ source_vm_id }} to {{ new_vm_id }}
- name: "Clone VM from template"
  ansible.builtin.command:
    cmd: >-
      qm clone {{ source_vm_id }} {{ new_vm_id }} --name {{ new_vm_name }}
      --full {{ full_clone | ternary('1', '0') }} --target {{ target_node }}
      --storage {{ storage_pool }}
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_clone_result
  changed_when: true
  until: cv_clone_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Hardware configuration
# ============================================================

# 9. Memory / Cores / OS type / Machine / BIOS / CPU / SCSI / Agent
- name: "Configure VM hardware (memory, cores, ostype, machine, bios, cpu, scsihw, agent)"
  ansible.builtin.shell:
    cmd: |
      CMD="qm set {{ new_vm_id }}"
      {% if clone_vm_memory is defined and clone_vm_memory != omit %}CMD+=" --memory {{ clone_vm_memory }}"{% endif %}
      {% if clone_vm_cores is defined and clone_vm_cores != omit %}CMD+=" --cores {{ clone_vm_cores }}"{% endif %}
      {% if clone_vm_ostype is defined and clone_vm_ostype != omit %}CMD+=" --ostype {{ clone_vm_ostype }}"{% endif %}
      {% if clone_vm_machine is defined and clone_vm_machine != omit %}CMD+=" --machine {{ clone_vm_machine }}"{% endif %}
      {% if clone_vm_bios is defined and clone_vm_bios != omit %}CMD+=" --bios {{ clone_vm_bios }}"{% endif %}
      {% if clone_vm_cpu is defined and clone_vm_cpu != omit %}CMD+=" --cpu {{ clone_vm_cpu }}"{% endif %}
      {% if clone_vm_scsihw is defined and clone_vm_scsihw != omit %}CMD+=" --scsihw {{ clone_vm_scsihw }}"{% endif %}
      {% if clone_vm_agent is defined and clone_vm_agent != omit %}CMD+=" --agent {{ clone_vm_agent }}"{% endif %}
      eval "$CMD"
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_config_result
  changed_when: "cv_config_result.stderr | length > 0"
  failed_when: cv_config_result.rc != 0 and 'no state change' not in cv_config_result.stderr
  until: cv_config_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Disk
# ============================================================

# 10a. Get current disk size before resize (if enabled)
- name: "Get current disk size for {{ new_vm_id }} slot {{ clone_vm_disk_slot }}"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | grep -E '{{ clone_vm_disk_slot }}.*size=' | head -1"
  register: cv_current_size_raw
  changed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and vm_resize_disk | bool

- name: "Validate new disk size is larger than current for {{ clone_vm_disk_slot }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      CURRENT=$(echo "{{ cv_current_size_raw.stdout }}" | grep -oP '{{ clone_vm_disk_slot }}.*size=\K[^,]*' || echo '') && \
      NEW="{{ clone_vm_disk_size }}" && \
      if [ "${CURRENT}" = "" ]; then exit 0; fi && \
      NUM_CURRENT="${CURRENT//G/}"; NUM_NEW="${NEW//[!0-9]/}" && \
      if [[ "$NUM_NEW" =~ ^[0-9]+$ ]] && (( NUM_NEW > NUM_CURRENT )); then echo "OK: ${NEW} > ${NUM_CURRENT}"; else exit 1; fi
    executable: /bin/bash
  register: cv_disk_validation
  changed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and vm_resize_disk | bool

- name: "Fail if new disk size is not larger than current"
  ansible.builtin.fail:
    msg: >
      Disk resize would shrink {{ clone_vm_disk_slot }} from {{ cv_current_size_raw.stdout }} to {{ clone_vm_disk_size }}.
      Resize only supports expanding disks, not shrinking them.

- name: "Resize VM disk if enabled"
  ansible.builtin.command:
    cmd: "qm resize {{ new_vm_id }} {{ clone_vm_disk_slot }} {{ clone_vm_disk_size }}"
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and vm_resize_disk | bool
  register: cv_resize_result
  changed_when: "cv_resize_result.stderr | length > 0"
  failed_when: cv_resize_result.rc != 0 and 'no state change' not in cv_resize_result.stderr
  until: cv_resize_result.rc == 0
  retries: 3
  delay: 10

# 11. Wait for disk resize to complete and verify
- name: "Wait for disk resize to complete and verify"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | grep -oP '{{ clone_vm_disk_slot }}.*size=\\K[^,]*'"
  register: cv_disk_size_check
  changed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and vm_resize_disk | bool and cv_resize_result is succeeded
  retries: 5
  delay: 5
  until: cv_disk_size_check.stdout == clone_vm_disk_size

# ============================================================
# Cloud-init
# ============================================================

# 12. Validate cloud-init template exists for os_type
- name: "Validate cloud-init template exists for os_type"
  ansible.builtin.stat:
    path: "{{ role_path }}/templates/cloud-init-{{ os_type }}.yaml.j2"
  register: cv_ci_template

- name: "Fail if cloud-init template not found"
  ansible.builtin.fail:
    msg: >
      Cloud-init template for os_type='{{ os_type }}' not found.
      Available: {{ lookup('fileglob', role_path ~ '/templates/cloud-init-*.yaml.j2', wantlist=True)
                    | map('basename') | map('regex_replace', '^cloud-init-|\.yaml\.j2$', '') | list }}
  when: not cv_ci_template.stat.exists

# 12a. Validate static IP configuration
- name: "Fail if static IP configured without required addresses"
  ansible.builtin.fail:
    msg: >
      use_dhcp_ip is false but static_ip_address or static_gateway is empty.
      Set static_ip_address='{{ static_ip_address }}' and static_gateway='{{ static_gateway }}'
      or enable use_dhcp_ip=true.
  when: >
    not (use_dhcp_ip | default(true) | bool) and
    (static_ip_address == "" or static_gateway == "")

# 13. Generate cloud-init user data from template
- name: "Generate complete cloud-init user data from template"
  ansible.builtin.template:
    src: "templates/cloud-init-{{ os_type }}.yaml.j2"
    dest: "{{ snippets_path }}/ci-{{ new_vm_id }}.yaml"
    mode: '0600'
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool

# 13. Configure cloud-init (DHCP)
- name: "Configure cloud-init with DHCP for new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: >-
      qm set {{ new_vm_id }} --cicustom user={{ snippets_storage }}:snippets/ci-{{ new_vm_id }}.yaml
      --ipconfig0 ip=dhcp --nameserver '{{ dns_servers }}'
      --searchdomain '{{ search_domains }}' --ciupgrade 0
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and (use_dhcp_ip | default(true))
  register: cv_set_dhcp_result
  changed_when: "cv_set_dhcp_result.stderr | length > 0"
  until: cv_set_dhcp_result.rc == 0
  retries: 3
  delay: 10

# 14. Configure cloud-init (static IP)
- name: "Configure cloud-init with static IP for new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: >-
      qm set {{ new_vm_id }} --cicustom user={{ snippets_storage }}:snippets/ci-{{ new_vm_id }}.yaml
      --ipconfig0 'ip={{ static_ip_address }}/{{ static_subnet_mask }},gw={{ static_gateway }}'
      --nameserver '{{ dns_servers }}' --searchdomain '{{ search_domains }}' --ciupgrade 0
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and (not use_dhcp_ip | default(true)) and static_ip_address != "" and static_gateway != ""
  register: cv_set_static_result
  changed_when: "cv_set_static_result.stderr | length > 0"
  until: cv_set_static_result.rc == 0
  retries: 3
  delay: 10

# 15. Update cloud-init drive
- name: "Update cloud-init drive with new data"
  ansible.builtin.command:
    cmd: "qm cloudinit update {{ new_vm_id }}"
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_ci_update_result
  changed_when: "cv_ci_update_result.stderr | length > 0"
  until: cv_ci_update_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Startup
# ============================================================

# 16. Start VM
- name: "Start the new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: "qm start {{ new_vm_id }}"
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_start_result
  changed_when: true
  until: cv_start_result.rc == 0
  retries: 3
  delay: 10

# 17. Final output
- name: "Final Output"
  ansible.builtin.debug:
    msg: "VM {{ new_vm_name }} (ID: {{ new_vm_id }}) created and started successfully."
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
