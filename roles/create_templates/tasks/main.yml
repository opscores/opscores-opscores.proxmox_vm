---
# tasks file for create_templates role

- name: Initialize ct_active_templates list
  ansible.builtin.set_fact:
    ct_active_templates: []

- name: Build ct_active_templates from enabled os_templates
  ansible.builtin.set_fact:
    ct_active_templates: "{{ ct_active_templates + [built_template] }}"
  loop: "{{ os_templates | dict2items }}"
  when: item.value.enabled | bool
  vars:
    built_template:
      name: "{{ item.key }}"
      vm_id: "{{ item.value.template_id }}"
      vm_name: "{{ item.value.vm_name }}"
      image_url: "{{ item.value.image_url }}"
      image_filename: "{{ item.value.image_filename }}"
      ostype: "{{ item.value.ostype | default(vm_defaults.ostype) }}"
      machine: "{{ item.value.machine | default(vm_defaults.machine) }}"
      bios: "{{ item.value.bios | default(vm_defaults.bios) }}"
      cpu_type: "{{ item.value.cpu_type | default(vm_defaults.cpu_type) }}"
      vm_memory: "{{ item.value.memory | default(vm_defaults.memory) }}"
      vm_cores: "{{ item.value.cores | default(vm_defaults.cores) }}"
      vm_disk_size: "{{ item.value.disk_size | default(vm_defaults.disk_size) }}"
      vm_network_bridge: "{{ item.value.network_bridge | default(vm_defaults.network_bridge) }}"
      scsihw: "{{ item.value.scsihw | default(vm_defaults.scsihw) }}"
      agent: "{{ item.value.agent | default(vm_defaults.agent) }}"
      enabled: true
      recreate: "{{ item.value.recreate | default(recreate_templates) }}"
      cleanup_image: "{{ item.value.cleanup_image | default(cleanup_downloaded_images) }}"

# Preflight checks
- name: "Preflight — detect Proxmox VE major version"
  ansible.builtin.shell:
    cmd: "set -o pipefail; pveversion | grep -oP 'pve-manager/\\K[0-9]+' || echo unknown"
  register: ct_pve_version
  changed_when: false

- name: "Preflight — warn if Proxmox VE major version is not the tested target (9.x)"
  ansible.builtin.debug:
    msg: >
      WARNING: detected Proxmox VE major version '{{ ct_pve_version.stdout }}'.
      This collection is developed and tested against Proxmox VE 9.x. It only uses
      generic `qm`/`pvesm` CLI commands with no version-specific flags, so other
      versions may work, but have not been verified. Proceeding anyway.
  when: ct_pve_version.stdout != "9"

# Preflight checks — free space
- name: Preflight — check free space in /tmp for image downloads
  ansible.builtin.shell:
    cmd: "set -o pipefail; df --output=avail -BG /tmp | tail -1 | sed 's/G//'"
  register: ct_tmp_free
  failed_when: ct_tmp_free.stdout | int < tmp_min_free_gb
  changed_when: false

- name: Preflight — verify storage pool exists and active ({{ vm_storage_pool }})
  ansible.builtin.shell:
    cmd: "set -o pipefail; pvesm status | awk -v pool='{{ vm_storage_pool }}' '$1 == pool && $3 == \"active\" {print $0}'"
  register: ct_storage_active
  failed_when: ct_storage_active.stdout == ""
  changed_when: false

- name: Set import format based on storage type
  ansible.builtin.set_fact:
    ct_import_disk_format: >-
      {{ 'raw' if (ct_pve_version.stdout | default('dir')) in ['lvm', 'lvmthin', 'zfspool', 'rbd'] else 'qcow2' }}

- name: Preflight — check free space in {{ vm_storage_pool }}
  ansible.builtin.shell:
    cmd: "set -o pipefail; pvesm status | awk -v pool='{{ vm_storage_pool }}' '$1 == pool {print $6}'"
  register: ct_storage_free
  failed_when: (ct_storage_free.stdout | int / 1048576) | int < storage_min_free_gb
  changed_when: false

# Validate VM IDs are in valid range
- name: "Validate template IDs for {{ item.name }} are in Proxmox ID range"
  ansible.builtin.assert:
    that:
      - item.vm_id | int >= 100
      - item.vm_id | int <= 999999999
    fail_msg: >
      Invalid template ID {{ item.vm_id }} for '{{ item.name }}'.
      Must be between 100 and 999999999.
  loop: "{{ ct_active_templates }}"

- name: Check snippets directory exists
  ansible.builtin.stat:
    path: "{{ snippets_path }}"
  register: ct_snippets_dir

- name: Create snippets directory if it doesn't exist
  ansible.builtin.file:
    path: "{{ snippets_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not ct_snippets_dir.stat.exists

# Check VM existence
- name: Check if VMs/Templates exist
  ansible.builtin.command:
    cmd: "test -f /etc/pve/nodes/{{ target_node }}/qemu-server/{{ item.vm_id }}.conf"
  register: ct_vm_status
  loop: "{{ ct_active_templates }}"
  changed_when: false
  failed_when: false

# Create VM existence dictionary
- name: Create VM existence dictionary
  ansible.builtin.set_fact:
    ct_vm_existence: "{{ ct_vm_existence | default({}) | combine({item.item.vm_id: 'exists' if item.rc == 0 else 'not_exists'}) }}"
  loop: "{{ ct_vm_status.results }}"

- name: Stop running VMs if they exist before destroying
  ansible.builtin.command:
    cmd: "qm stop {{ item.vm_id }}"
  loop: "{{ ct_active_templates }}"
  when:
    - ct_vm_existence[item.vm_id] == "exists"
    - item.recreate | bool
  failed_when: false
  register: ct_stop_result
  changed_when: true
  until: ct_stop_result.rc == 0
  retries: 3
  delay: 10

- name: Destroy existing VMs/Templates if they exist and recreate is true
  ansible.builtin.command:
    cmd: "qm destroy {{ item.vm_id }} --purge"
  loop: "{{ ct_active_templates }}"
  when:
    - ct_vm_existence[item.vm_id] == "exists"
    - item.recreate | bool
  changed_when: true

- name: Validate CPU configuration before VM creation
  ansible.builtin.fail:
    msg: "Invalid CPU type format for {{ item.name }}: {{ item.cpu_type }}. Use simple types like 'host', 'kvm64', 'x86-64-v2', etc."
  when: "'flags=' in item.cpu_type or ';' in item.cpu_type or ',' in item.cpu_type"
  loop: "{{ ct_active_templates }}"

- name: Create VMs with CPU configuration
  ansible.builtin.command:
    cmd: >
      qm create {{ item.vm_id }}
      --name {{ item.vm_name }}
      --memory {{ item.vm_memory }}
      --cores {{ item.vm_cores }}
      --ostype {{ item.ostype }}
      --machine {{ item.machine }}
      --bios {{ item.bios }}
      --cpu {{ item.cpu_type }}
      --scsihw {{ item.scsihw }}
      --agent {{ item.agent }}
  loop: "{{ ct_active_templates }}"
  when:
    - ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_create_result
  changed_when: true
  until: ct_create_result.rc == 0
  retries: 3
  delay: 10

- name: Verify VMs were created
  ansible.builtin.command:
    cmd: "test -f /etc/pve/nodes/{{ target_node }}/qemu-server/{{ item.vm_id }}.conf"
  register: ct_vm_conf_check
  loop: "{{ ct_active_templates }}"
  when:
    - ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  changed_when: false

- name: Fail fast if VM creation did not produce a config file
  ansible.builtin.fail:
    msg: "qm create did not produce a config file for: {{ ct_vm_conf_check.results | selectattr('failed', 'true') | map(attribute='item.name') | list }}"
  when: ct_vm_conf_check.results is defined and ct_vm_conf_check.results | selectattr('failed', 'true') | list | length > 0

- name: Debug CPU configuration
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ item.vm_id }} | grep -i cpu || true"
  register: ct_cpu_config
  loop: "{{ ct_active_templates }}"
  when:
    - ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  changed_when: false

- name: Show CPU config
  ansible.builtin.debug:
    msg: "VM {{ item.item.vm_id }} CPU: {{ item.stdout }}"
  loop: "{{ ct_cpu_config.results }}"
  when:
    - ct_vm_existence[item.item.vm_id] == "not_exists" or item.item.recreate | bool


# Check cloud images - create lookup dictionary
- name: Check if cloud images already exist
  ansible.builtin.stat:
    path: "/tmp/{{ item.image_filename }}"
  register: ct_cloud_images
  loop: "{{ ct_active_templates }}"

- name: Create cloud images dictionary for easy lookup
  ansible.builtin.set_fact:
    ct_cloud_images_dict: "{{ ct_cloud_images_dict | default({}) | combine({item.item.name: item}) }}"
  loop: "{{ ct_cloud_images.results }}"

- name: Download cloud images if they don't exist
  ansible.builtin.get_url:
    url: "{{ item.image_url }}"
    dest: "/tmp/{{ item.image_filename }}"
    mode: '0644'
    force: false
  loop: "{{ ct_active_templates }}"
  when:
    - not ct_cloud_images_dict[item.name].stat.exists
  register: ct_download_result
  until: ct_download_result is succeeded
  retries: 3
  delay: 10
  tags: [download]

- name: Debug download status
  ansible.builtin.debug:
    verbosity: 1
    msg: "Image for {{ item.name }} {{ 'will be downloaded' if not ct_cloud_images_dict[item.name].stat.exists else 'already exists' }}"
  loop: "{{ ct_active_templates }}"

- name: Check available storage before import
  ansible.builtin.shell:
    cmd: "set -o pipefail; pvesm status | grep '{{ vm_storage_pool }}' || true"
  register: ct_storage_check
  changed_when: false

- name: Debug storage info
  ansible.builtin.debug:
    verbosity: 1
    var: ct_storage_check.stdout

# Import cloud images
- name: Import cloud images
  ansible.builtin.command:
    cmd: "qm importdisk {{ item.vm_id }} /tmp/{{ item.image_filename }} {{ vm_storage_pool }} --format {{ ct_import_disk_format }}"
  loop: "{{ ct_active_templates }}"
  when:
    - (ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool) and ct_cloud_images_dict[item.name].stat.exists
  async: "{{ import_timeout_seconds }}"
  poll: "{{ import_poll_interval_seconds }}"
  register: ct_import_result
  failed_when: ct_import_result.rc != 0 and 'already exists' not in ct_import_result.stderr
  changed_when: "'importing' in ct_import_result.stdout"

- name: Fail if any import failed
  ansible.builtin.fail:
    msg: "Import failed for: {{ ct_import_result.results | selectattr('failed', 'true') | map(attribute='item.name') | list }}"
  when: ct_import_result.results is defined and ct_import_result.results | selectattr('failed', 'true') | list | length > 0

- name: Show final import status
  ansible.builtin.debug:
    msg: "Import {{ 'completed' if not item.failed else 'failed' }} for {{ item.item.name }}"
  loop: "{{ ct_import_result.results }}"
  when:
    - (ct_vm_existence[item.item.vm_id] == "not_exists" or item.item.recreate | bool) and ct_cloud_images_dict[item.item.name].stat.exists

# 1. Attach disk with optimal parameters
- name: Attach imported disk to VM
  ansible.builtin.command:
    cmd: >
      qm set {{ item.vm_id }}
      --scsi0 {{ vm_storage_pool }}:vm-{{ item.vm_id }}-disk-0,discard=on,ssd=1
      --boot order=scsi0
  loop: "{{ ct_active_templates }}"
  when: ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_set_disk_result
  changed_when: "ct_set_disk_result.stderr | length > 0"
  until: ct_set_disk_result.rc == 0
  retries: 3
  delay: 10

# 2. Attach cloud-init CD-ROM
- name: Add cloud-init drive
  ansible.builtin.command:
    cmd: "qm set {{ item.vm_id }} --ide2 {{ vm_storage_pool }}:cloudinit"
  loop: "{{ ct_active_templates }}"
  when: ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_set_ci_drive_result
  changed_when: "ct_set_ci_drive_result.stderr | length > 0"
  until: ct_set_ci_drive_result.rc == 0
  retries: 3
  delay: 10

# 3. Attach network interface
- name: Add network interface to VM
  ansible.builtin.command:
    cmd: "qm set {{ item.vm_id }} --net0 virtio,bridge={{ item.vm_network_bridge }}"
  loop: "{{ ct_active_templates }}"
  when: ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_set_net_result
  changed_when: "ct_set_net_result.stderr | length > 0"
  until: ct_set_net_result.rc == 0
  retries: 3
  delay: 10

# 4. DHCP as network fallback
- name: Set default Cloud-Init network config (DHCP fallback)
  ansible.builtin.command:
    cmd: "qm set {{ item.vm_id }} --ipconfig0 ip=dhcp"
  loop: "{{ ct_active_templates }}"
  when: ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_set_ip_result
  changed_when: "ct_set_ip_result.stderr | length > 0"
  until: ct_set_ip_result.rc == 0
  retries: 3
  delay: 10

# 5. Convert to template
- name: Convert VMs to templates
  ansible.builtin.command:
    cmd: "qm template {{ item.vm_id }}"
  loop: "{{ ct_active_templates }}"
  when: ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool
  register: ct_template_result
  changed_when: true
  until: ct_template_result.rc == 0
  retries: 3
  delay: 10

# 6. Cleanup downloaded images (optional)
- name: Cleanup downloaded images
  ansible.builtin.file:
    path: "/tmp/{{ item.image_filename }}"
    state: absent
  loop: "{{ ct_active_templates }}"
  when: (ct_vm_existence[item.vm_id] == "not_exists" or item.recreate | bool) and item.cleanup_image | bool and ct_cloud_images_dict[item.name].stat.exists
