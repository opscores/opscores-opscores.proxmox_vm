---
- name: Clone VM from Template with DHCP
  hosts: proxmox
  serial: 1
  vars:
    # Source template configuration
    source_vm_id: 3002      # Source template ID (3000=Ubuntu24, 3004=Ubuntu26, 3001=AlmaLinux, 3002=Fedora)
    os_type: "fedora"      # OS type: 'ubuntu24', 'ubuntu26', 'almalinux' or 'fedora'

    # New VM configuration
    new_vm_id: 8001         # New VM ID
    new_vm_name: "dhcp-fedora-vm" # Desired hostname for the new VM
    cloud_user: "ansible"
    cloud_password: "{{ vault_cloud_password | default('changeme') }}"  # Use ansible-vault
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}" # Path to your public SSH key

    # Proxmox environment (values from inventory)
    target_node: "{{ proxmox_node }}"
    storage_pool: "{{ vm_storage_pool }}"
    full_clone: true
    recreate_vm: false

    # VM parameters (override template defaults)
    clone_vm_memory: 2048  # VM memory in MB
    clone_vm_cores: 2      # Number of CPU cores
    clone_vm_disk_size: "12G"  # Disk size

    # Network configuration (DHCP default)
    use_dhcp_ip: true  # Use DHCP instead of static IP

  tasks:
    - name: Clone VM with DHCP
      ansible.builtin.include_role:
        name: opscores.proxmox_vm.clone_vm
